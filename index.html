<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>

<title>لوحة الإنذارات - LINE AB & LINE C</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--primary: #10b981;
--primary-ab: #3b82f6;
--bg-dark: #020617;
--panel-bg: #0f172a;
--cell-bg: #1e293b;
--border: #334155;
--text-light: #f8fafc;
--text-dim: #94a3b8;
}
body {
background-color: var(--bg-dark);
color: var(--text-light);
font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
margin: 0; padding: 0;
display: flex; flex-direction: column;
min-height: 100vh; box-sizing: border-box;
}
/* ===== LINE SELECTOR SCREEN ===== */
#lineSelectorScreen {
position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: var(--bg-dark);
z-index: 50000;
display: flex; align-items: center; justify-content: center;
padding: 20px;
transition: opacity 0.4s ease;
}
.selector-box {
background: var(--panel-bg);
border: 1px solid var(--border);
border-radius: 20px;
padding: 40px 30px;
text-align: center;
max-width: 480px; width: 100%;
box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.selector-logo {
width: 400px; height: 250px;
margin: 0 auto 20px auto;
}
.selector-logo img { width: 100%; height: 100%; object-fit: contain; }
.selector-box h1 {
margin: 0 0 6px 0;
font-size: 22px;
color: var(--text-light);
font-weight: 700;
}
.selector-box p {
margin: 0 0 30px 0;
color: var(--text-dim);
font-size: 14px;
}
.line-buttons {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 16px;
}
.line-btn {
padding: 24px 16px;
border-radius: 14px;
border: 2px solid;
cursor: pointer;
font-family: inherit;
font-weight: 700;
font-size: 18px;
transition: all 0.2s;
display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.line-btn-ab {
background: rgba(59, 130, 246, 0.1);
border-color: #3b82f6;
color: #3b82f6;
}
.line-btn-ab:hover {
background: rgba(59, 130, 246, 0.25);
box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
transform: translateY(-2px);
}
.line-btn-c {
background: rgba(16, 185, 129, 0.1);
border-color: #10b981;
color: #10b981;
}
.line-btn-c:hover {
background: rgba(16, 185, 129, 0.25);
box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
transform: translateY(-2px);
}
.line-btn .btn-icon { font-size: 28px; }
.line-btn .btn-label { font-size: 20px; letter-spacing: 1px; }
.line-btn .btn-sub { font-size: 11px; opacity: 0.7; font-weight: 400; }

/* ===== MAIN APP ===== */
.app-container {
display: flex; flex-direction: column;
width: 100%; max-width: 1200px;
margin: 0 auto; padding: 15px;
box-sizing: border-box; gap: 15px;
}
.brand-header {
display: flex; justify-content: space-between; align-items: center;
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 15px;
}
.brand-title h3 { margin: 0; font-size: 20px; color: var(--text-light); }
.company-logo {
width: 110px; height: 110px;
display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.company-logo img { width: 100%; height: 100%; object-fit: contain; }
.search-box {
flex-grow: 1; padding: 12px;
background: var(--bg-dark); border: 1px solid var(--border);
color: white; border-radius: 8px;
font-family: inherit; font-size: 14px;
box-sizing: border-box; width: 100%; margin-top: 10px;
}

/* ===== LINE SWITCHER TABS ===== */
.line-switcher {
display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.line-tab {
padding: 8px 20px; border-radius: 8px; border: 2px solid;
cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px;
transition: all 0.2s;
}
.line-tab-ab {
border-color: #3b82f6; color: #3b82f6;
background: rgba(59,130,246,0.08);
}
.line-tab-ab.active, .line-tab-ab:hover {
background: rgba(59,130,246,0.2);
box-shadow: 0 0 10px rgba(59,130,246,0.3);
}
.line-tab-c {
border-color: #10b981; color: #10b981;
background: rgba(16,185,129,0.08);
}
.line-tab-c.active, .line-tab-c:hover {
background: rgba(16,185,129,0.2);
box-shadow: 0 0 10px rgba(16,185,129,0.3);
}

.status-badge {
font-size: 12px; color: var(--primary);
background: rgba(16, 185, 129, 0.1);
padding: 6px 12px; border-radius: 20px;
border: 1px solid var(--primary); white-space: nowrap;
}
.panel-section {
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 15px;
}
.section-title { margin: 0; font-size: 14px; color: var(--text-dim); font-weight: 600; }
.annunciator-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 6px;
}
@media (min-width: 768px) {
.annunciator-grid { grid-template-columns: repeat(8, 1fr); }
}
.cell {
aspect-ratio: 1 / 0.8;
background: var(--cell-bg); border: 1px solid var(--border);
border-radius: 6px; display: flex; align-items: center;
justify-content: center; text-align: center;
font-size: 10px; font-weight: bold; padding: 4px;
cursor: pointer; transition: all 0.2s;
text-transform: uppercase; overflow: hidden;
word-break: break-word; user-select: none;
}
.cell:hover { border-color: var(--primary); background: #243146; }
.cell.active {
border-color: var(--primary);
box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
background: rgba(16, 185, 129, 0.15); color: var(--primary);
}
.cell.active-ab {
border-color: #3b82f6;
box-shadow: 0 0 12px rgba(59,130,246, 0.4);
background: rgba(59,130,246, 0.15); color: #3b82f6;
}
.cell.has-data { border-right: 3px solid #34d399; }
.cell.has-data-ab { border-right: 3px solid #60a5fa; }
.cell.empty { opacity: 0.15; pointer-events: none; }
.details-section {
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 20px;
display: flex; flex-direction: column; gap: 15px;
}
.alarm-header-title { font-size: 22px; color: var(--primary); margin: 0; font-weight: 700; }
.alarm-header-title-ab { font-size: 22px; color: #3b82f6; margin: 0; font-weight: 700; }
.info-cards-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
@media (min-width: 768px) {
.info-cards-container { grid-template-columns: 1fr 1fr; }
}
.info-card {
background: var(--cell-bg); border: 1px solid var(--border);
border-radius: 10px; padding: 15px;
display: flex; flex-direction: column; gap: 8px;
}
.info-card h4 { margin: 0; color: var(--text-dim); font-size: 13px; font-weight: bold; }
textarea {
width: 100%; min-height: 90px;
background: var(--bg-dark); border: 1px solid var(--border);
border-radius: 6px; color: white;
font-family: inherit; padding: 10px;
resize: vertical; outline: none;
font-size: 13px; line-height: 1.5; box-sizing: border-box;
}
textarea:disabled {
background: rgba(15, 23, 42, 0.6);
color: #cbd5e1; cursor: not-allowed; border-style: dashed;
}
.admin-controls {
display: flex; justify-content: space-between; align-items: center;
margin-top: 10px; padding-top: 15px;
border-top: 1px solid var(--border);
flex-wrap: wrap; gap: 10px; width: 100%;
}
.btn { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; font-size: 13px; }
.btn-primary { background: var(--primary); color: #020617; }
.placeholder-text { text-align: center; color: var(--text-dim); padding: 40px 10px; }
.developer-signature { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 10px; font-weight: 600; letter-spacing: 0.5px; }
.developer-signature span { color: var(--primary); font-weight: bold; }

/* line indicator badge */
.active-line-badge {
display: inline-flex; align-items: center; gap: 6px;
font-size: 12px; font-weight: 700;
padding: 5px 12px; border-radius: 20px;
border: 1px solid;
}
.badge-ab { color: #3b82f6; border-color: #3b82f6; background: rgba(59,130,246,0.1); }
.badge-c { color: #10b981; border-color: #10b981; background: rgba(16,185,129,0.1); }

/* ===== IMAGES SECTION ===== */
.images-section {
background: var(--cell-bg); border: 1px solid var(--border);
border-radius: 10px; padding: 15px;
display: flex; flex-direction: column; gap: 12px;
margin-top: 4px;
}
.images-section h4 { margin: 0; color: var(--text-dim); font-size: 13px; font-weight: bold; }
.img-admin-row {
display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.img-url-input {
flex: 1; min-width: 200px; padding: 9px 12px;
background: var(--bg-dark); border: 1px solid var(--border);
border-radius: 6px; color: white; font-family: inherit; font-size: 13px;
outline: none; box-sizing: border-box;
}
.img-url-input::placeholder { color: #475569; }
.btn-add-img {
padding: 9px 16px; border-radius: 6px; border: none;
background: var(--primary); color: #020617;
cursor: pointer; font-weight: bold; font-family: inherit; font-size: 13px;
white-space: nowrap;
}
.images-gallery {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
gap: 10px;
}
.img-thumb-wrap {
position: relative; border-radius: 8px; overflow: hidden;
border: 1px solid var(--border); background: var(--bg-dark);
aspect-ratio: 4/3; cursor: pointer;
}
.img-thumb-wrap img {
width: 100%; height: 100%; object-fit: cover;
transition: transform 0.2s;
}
.img-thumb-wrap:hover img { transform: scale(1.05); }
.img-delete-btn {
position: absolute; top: 4px; left: 4px;
background: rgba(220,38,38,0.85); color: white;
border: none; border-radius: 4px; width: 22px; height: 22px;
cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}
.img-empty { color: #475569; font-size: 12px; padding: 10px 0; }

/* ===== LIGHTBOX ===== */
#lightbox {
display: none; position: fixed; top:0; left:0; right:0; bottom:0;
background: rgba(0,0,0,0.92); z-index: 99999;
align-items: center; justify-content: center; padding: 20px;
}
#lightbox img {
max-width: 95vw; max-height: 90vh;
border-radius: 10px; object-fit: contain;
box-shadow: 0 10px 60px rgba(0,0,0,0.8);
}
#lightbox-close {
position: absolute; top: 15px; left: 15px;
background: rgba(255,255,255,0.15); color: white;
border: none; border-radius: 50%; width: 38px; height: 38px;
font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}

.export-modal {
display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
z-index: 20000; align-items: center; justify-content: center; padding: 20px;
}
.export-box {
background: var(--panel-bg); border: 1px solid var(--border); border-radius: 16px;
padding: 25px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.code-output {
width: 100%; height: 250px; background: #020617; border: 1px solid var(--border);
border-radius: 8px; color: #34d399; font-family: monospace; font-size: 12px;
padding: 15px; box-sizing: border-box; overflow: auto; white-space: pre-wrap; margin: 15px 0;
direction: ltr; text-align: left;
}
</style>
</head>
<body>

// ============================================================
// LINE AB ALARMS — نفس أسماء الإنذارات، قاعدة بيانات فارغة جاهزة للتعبئة
// ============================================================
const alarmNamesAB = [
"Unit In Alarm","SIC On Fixed Speed","SIC Not Ready Auto","SIC Not Ready Fix SP","Control Mode Error","Lube Res Temp Low","Pump Seal Fail","Lube Pres Before TCV Low",
"SIC MV Warning","Brush Length","Unit Not On Auto","Uncon Non Urg Fail","MOV Sequence Fail","Lube Res Temp High","Lube Res Level Low","Filter Diff Pres High",
"Slipr Case Temp High","Cool Air Dif Press","Motor Air Temp High","Motor Bear Temp High","Motor Wind Temp High","Pump Bear Temp High","Pump Water Temp High","Pump Vibration High",
"Unit Tripped","Unit ESD","Seq Fail","Uncon Urg Fail","Suction Press Low","Discharge Press High","Lube Pres After Low",
"SIC MV Starter SD","DREAV On Command","MV Breaker Close","Lube Temp High","Lube Level Low Low",
"Slipr Case Temp HH","Motor Air Temp HH","Motor Bear Temp HH","Motor Wind Temp HH","Pump Bear Temp HH","Pump Water Temp HH","Pump Vibration HH"
];

const embeddedDBAB = {
"0": { "cause": "", "action": "", "dwg": "", "notes": "" }
};

// ============================================================
// STATE
// ============================================================
let currentLine = 'C';
let dbC = Object.assign({}, embeddedDBC);
let dbAB = Object.assign({}, embeddedDBAB);
let isAdmin = new URLSearchParams(window.location.search).get('edit') === 'majid99';

function getCurrentDB() { return currentLine === 'C' ? dbC : dbAB; }
function getCurrentAlarmNames() { return currentLine === 'C' ? alarmNamesC : alarmNamesAB; }

// ============================================================
// LINE SELECTOR
// ============================================================
function selectLine(line) {
var screen = document.getElementById('lineSelectorScreen');
screen.style.opacity = '0';
setTimeout(function() {
screen.style.display = 'none';
currentLine = line;
applyLineTheme(line);
initApp();
}, 400);
}

function switchLine(line) {
currentLine = line;
applyLineTheme(line);
document.getElementById('detailsSection').innerHTML = '<div class="placeholder-text">💡 اضغط على أي إنذار في المصفوفة أعلاه لعرض أسبابه والإجراءات الفنية المطلوبة فوراً.</div>';
buildGrid();
// update tabs
document.getElementById('tabAB').classList.toggle('active', line === 'AB');
document.getElementById('tabC').classList.toggle('active', line === 'C');
}

function applyLineTheme(line) {
var badge = document.getElementById('activeLineBadge');
if(line === 'AB') {
badge.textContent = ' LINE AB';
badge.className = 'active-line-badge badge-ab';
document.querySelector(':root').style.setProperty('--primary', '#3b82f6');
} else {
badge.textContent = ' LINE C';
badge.className = 'active-line-badge badge-c';
document.querySelector(':root').style.setProperty('--primary', '#10b981');
}
document.getElementById('tabAB').classList.toggle('active', line === 'AB');
document.getElementById('tabC').classList.toggle('active', line === 'C');
}

// ============================================================
// INIT
// ============================================================
function initApp() {
document.getElementById('designerName').innerText = MY_NAME;
var logo = document.getElementById('logoImg');
if(LOGO_URL) { logo.src = LOGO_URL; logo.style.display='block'; } else { logo.style.display='none'; }

var badge = document.getElementById('roleBadge');
if(isAdmin) {
badge.innerText = " (أدمن)";
badge.style.color = "#f59e0b";
badge.style.borderColor = "#f59e0b";
badge.style.background = "rgba(245,158,11,0.1)";
} else {
badge.innerText = "view";
badge.style.color = currentLine === 'AB' ? '#3b82f6' : '#10b981';
badge.style.borderColor = currentLine === 'AB' ? '#3b82f6' : '#10b981';
badge.style.background = currentLine === 'AB' ? 'rgba(59,130,246,0.1)' : 'rgba(16,185,129,0.1)';
}

buildGrid();
}

function buildGrid() {
var db = getCurrentDB();
var names = getCurrentAlarmNames();
var isAB = currentLine === 'AB';

var grid = document.getElementById('grid');
grid.innerHTML = '';
names.forEach(function(name, index) {
var cell = document.createElement('div');
cell.className = 'cell' + (name === "" ? ' empty' : '');
if(db[index] && (db[index].cause || db[index].action || db[index].dwg || db[index].notes)) {
cell.classList.add(isAB ? 'has-data-ab' : 'has-data');
}
cell.innerText = name;
cell.onclick = function() { showDetails(index, name); };
grid.appendChild(cell);
});
}

function showDetails(index, name) {
var isAB = currentLine === 'AB';
document.querySelectorAll('.cell').forEach(function(c) {
c.classList.remove('active'); c.classList.remove('active-ab');
});
var cells = document.querySelectorAll('.cell');
if(cells[index]) cells[index].classList.add(isAB ? 'active-ab' : 'active');

var db = getCurrentDB();
var data = db[index] || { cause:'', action:'', dwg:'', notes:'', images:[] };
if(!data.images) data.images = [];
var dis = isAdmin ? '' : 'disabled';

var adminHtml = isAdmin
? '<div class="admin-controls">'
+ '<span style="color:#f59e0b;font-size:12px;">⚠️ عدّل البيانات ثم اضغط الزر لتوليد الكود الجديد لحفظه في GitHub</span>'
+ '<button class="btn btn-primary" onclick="exportDB()">📋 تصدير وتحديث الكود</button>'
+ '</div>'
: '';

var titleClass = isAB ? 'alarm-header-title-ab' : 'alarm-header-title';
var lineTag = '<span style="font-size:13px; opacity:0.7; margin-right:10px;">[' + currentLine + ']</span>';

var imagesHtml = makeImagesSection(index, data.images);

document.getElementById('detailsSection').innerHTML =
'<div><h2 class="' + titleClass + '">' + lineTag + name + '</h2></div>'
+ '<div class="info-cards-container">'
+ makeCard('⚠️ أسباب الإنذار (Root Cause)', index, 'cause', data.cause, dis)
+ makeCard('🛠️عمل المشغل (Actions)', index, 'action', data.action, dis)
+ makeCard('📑 القسم المسؤول (Depart Resp)', index, 'dwg', data.dwg, dis)
+ makeCard('📝 ملاحظات إضافية', index, 'notes', data.notes, dis)
+ '</div>'
+ imagesHtml
+ adminHtml;

if(window.innerWidth < 768) {
document.getElementById('detailsSection').scrollIntoView({ behavior:'smooth' });
}
}

function makeCard(title, index, field, value, dis) {
return '<div class="info-card">'
+ '<h4>' + title + '</h4>'
+ '<textarea ' + dis + ' placeholder="لا توجد بيانات مسجلة..." oninput="updateDB(' + index + ',\'' + field + '\',this.value)">' + (value||'') + '</textarea>'
+ '</div>';
}

function makeImagesSection(index, images) {
var thumbsHtml = '';
if(images && images.length > 0) {
images.forEach(function(url, i) {
var delBtn = isAdmin
? '<button class="img-delete-btn" onclick="deleteImage(' + index + ',' + i + ')" title="حذف الصورة">✕</button>'
: '';
thumbsHtml += '<div class="img-thumb-wrap">'
+ delBtn
+ '<img src="' + url + '" alt="صورة ' + (i+1) + '" onclick="openLightbox(\'' + url.replace(/'/g,"\\'") + '\')" onerror="this.parentElement.style.display=\'none\'">'
+ '</div>';
});
} else {
thumbsHtml = '<div class="img-empty">لا توجد صور مضافة بعد</div>';
}

var addRowHtml = isAdmin
? '<div class="img-admin-row">'
+ '<input class="img-url-input" id="imgUrlInput_' + index + '" type="text" placeholder="أدخل رابط الصورة URL هنا..." />'
+ '<button class="btn-add-img" onclick="addImage(' + index + ')">+ إضافة صورة</button>'
+ '</div>'
: '';

return '<div class="images-section">'
+ '<h4>🖼️ </h4>'
+ addRowHtml
+ '<div class="images-gallery" id="gallery_' + index + '">' + thumbsHtml + '</div>'
+ '</div>';
}

function addImage(index) {
var input = document.getElementById('imgUrlInput_' + index);
var url = input ? input.value.trim() : '';
if(!url) { alert('أدخل رابط الصورة أولاً'); return; }
var db = getCurrentDB();
if(!db[index]) db[index] = {};
if(!db[index].images) db[index].images = [];
db[index].images.push(url);
if(input) input.value = '';
// re-render gallery only
var gallery = document.getElementById('gallery_' + index);
if(gallery) {
var imgs = db[index].images;
gallery.innerHTML = '';
imgs.forEach(function(u, i) {
var wrap = document.createElement('div');
wrap.className = 'img-thumb-wrap';
wrap.innerHTML = '<button class="img-delete-btn" onclick="deleteImage(' + index + ',' + i + ')" title="حذف">✕</button>'
+ '<img src="' + u + '" alt="صورة ' + (i+1) + '" onclick="openLightbox(\'' + u.replace(/'/g,"\\'") + '\')" onerror="this.parentElement.style.display=\'none\'">';
gallery.appendChild(wrap);
});
}
}

function deleteImage(index, imgIndex) {
if(!confirm('هل تريد حذف هذه الصورة؟')) return;
var db = getCurrentDB();
if(db[index] && db[index].images) {
db[index].images.splice(imgIndex, 1);
// re-render
var gallery = document.getElementById('gallery_' + index);
if(gallery) {
var imgs = db[index].images;
if(imgs.length === 0) {
gallery.innerHTML = '<div class="img-empty">لا توجد صور مضافة بعد</div>';
} else {
gallery.innerHTML = '';
imgs.forEach(function(u, i) {
var wrap = document.createElement('div');
wrap.className = 'img-thumb-wrap';
wrap.innerHTML = '<button class="img-delete-btn" onclick="deleteImage(' + index + ',' + i + ')" title="حذف">✕</button>'
+ '<img src="' + u + '" alt="صورة ' + (i+1) + '" onclick="openLightbox(\'' + u.replace(/'/g,"\\'") + '\')" onerror="this.parentElement.style.display=\'none\'">';
gallery.appendChild(wrap);
});
}
}
}
}

function openLightbox(url) {
document.getElementById('lightbox-img').src = url;
var lb = document.getElementById('lightbox');
lb.style.display = 'flex';
}

function closeLightbox() {
document.getElementById('lightbox').style.display = 'none';
document.getElementById('lightbox-img').src = '';
}

function updateDB(index, field, value) {
if(!isAdmin) return;
var db = getCurrentDB();
if(!db[index]) db[index] = {};
db[index][field] = value;
var cells = document.querySelectorAll('.cell');
if(cells[index]) cells[index].classList.add(currentLine === 'AB' ? 'has-data-ab' : 'has-data');
}

function filterAlarms(val) {
document.querySelectorAll('.cell').forEach(function(cell) {
cell.style.opacity = cell.innerText.toLowerCase().includes(val.toLowerCase()) ? '1' : '0.15';
});
}

function exportDB() {
var cleanDBC = JSON.stringify(dbC, null, 2);
var cleanDBAB = JSON.stringify(dbAB, null, 2);

var parser = new DOMParser();
var doc = parser.parseFromString(document.documentElement.outerHTML, 'text/html');

var details = doc.getElementById('detailsSection');
if(details) {
details.innerHTML = '<div class="placeholder-text">💡 اضغط على أي إنذار في المصفوفة أعلاه لعرض أسبابه والإجراءات الفنية المطلوبة فوراً.</div>';
}

var finalHtml = "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
finalHtml = finalHtml.replace(/const embeddedDBC = \s*\{[\s\S]*?\};/, "const embeddedDBC = " + cleanDBC + ";");
finalHtml = finalHtml.replace(/const embeddedDBAB = \s*\{[\s\S]*?\};/, "const embeddedDBAB = " + cleanDBAB + ";");

document.getElementById('codeOutputArea').value = finalHtml;
document.getElementById('exportModal').style.display = 'flex';
}

function closeExportModal() {
document.getElementById('exportModal').style.display = 'none';
}

function copyGeneratedCode() {
var copyText = document.getElementById('codeOutputArea');
copyText.select();
copyText.setSelectionRange(0, 99999);
navigator.clipboard.writeText(copyText.value).then(function() {
alert("🎯 تم التطهير والنسخ بنجاح!\n\nالآن الكود مهيأ ليكون مغلقاً تلقائياً وبصفحة ترحيبية نظيفة عند المشغلين عند رفعه على GitHub.");
closeExportModal();
});
}

function goHome() {
document.getElementById('detailsSection').innerHTML = '<div class="placeholder-text">💡 اضغط على أي إنذار في المصفوفة أعلاه لعرض أسبابه والإجراءات الفنية المطلوبة فوراً.</div>';
var screen = document.getElementById('lineSelectorScreen');
screen.style.display = 'flex';
screen.style.opacity = '0';
setTimeout(function() { screen.style.opacity = '1'; }, 10);
}

// Start with selector visible
document.getElementById('lineSelectorScreen').style.display = 'flex';
document.getElementById('lineSelectorScreen').style.opacity = '1';
// Init app in background (LINE C default)
currentLine = 'C';
applyLineTheme('C');
initApp();
</script>
