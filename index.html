<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINEC ALARMS</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LINEC Alarms">
<meta name="theme-color" content="#020617">
<link rel="apple-touch-icon" href="https://instasize.com/api/image/468677e3bce3b1be1a34b8102f883c0773080e96f92413004b530bee9d1dd44b.png?download=true">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Noto+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root {
--primary: #10b981;
--bg-dark: #020617;
--panel-bg: #0f172a;
--cell-bg: #1e293b;
--border: #334155;
--text-light: #f8fafc;
--text-dim: #94a3b8;
}
body {
background-color: var(--bg-dark);
color: var(--text-light);
font-family: 'Noto Sans Arabic', 'Inter', sans-serif;
margin: 0; padding: 0;
display: flex; flex-direction: column;
min-height: 100vh; box-sizing: border-box;
padding-top: env(safe-area-inset-top);
padding-bottom: env(safe-area-inset-bottom);
}
.app-container {
display: flex; flex-direction: column;
width: 100%; max-width: 1200px;
margin: 0 auto; padding: 15px;
box-sizing: border-box; gap: 15px;
}
.brand-header {
display: flex; justify-content: space-between; align-items: center;
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 15px;
}
.brand-title h3 { margin: 0; font-size: 20px; color: var(--text-light); }
.company-logo {
width: 55px; height: 55px; background: #1e293b;
border: 1px dashed var(--primary); border-radius: 8px;
display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.company-logo img { width: 100%; height: 100%; object-fit: contain; }
.search-box {
flex-grow: 1; padding: 12px;
background: var(--bg-dark); border: 1px solid var(--border);
color: white; border-radius: 8px;
font-family: inherit; font-size: 14px;
box-sizing: border-box; width: 100%; margin-top: 10px;
}
.status-badge {
font-size: 12px; color: var(--primary);
background: rgba(16, 185, 129, 0.1);
padding: 6px 12px; border-radius: 20px;
border: 1px solid var(--primary); white-space: nowrap;
}
.panel-section {
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 15px;
}
.section-title { margin: 0; font-size: 14px; color: var(--text-dim); font-weight: 600; }
.annunciator-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 6px;
}
@media (min-width: 768px) {
.annunciator-grid { grid-template-columns: repeat(8, 1fr); }
}
.cell {
aspect-ratio: 1 / 0.8;
background: var(--cell-bg); border: 1px solid var(--border);
border-radius: 6px; display: flex; align-items: center;
justify-content: center; text-align: center;
font-size: 10px; font-weight: bold; padding: 4px;
cursor: pointer; transition: all 0.2s;
text-transform: uppercase; overflow: hidden;
word-break: break-word; user-select: none;
}
.cell:hover { border-color: var(--primary); background: #243146; }
.cell.active {
border-color: var(--primary);
box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
background: rgba(16, 185, 129, 0.15); color: var(--primary);
}
.cell.has-data { border-right: 3px solid #34d399; }
.cell.empty { opacity: 0.15; pointer-events: none; }
.details-section {
background: var(--panel-bg); border: 1px solid var(--border);
border-radius: 12px; padding: 20px;
display: flex; flex-direction: column; gap: 15px;
}
.alarm-header-title { font-size: 22px; color: var(--primary); margin: 0; font-weight: 700; }
.info-cards-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
@media (min-width: 768px) {
.info-cards-container { grid-template-columns: 1fr 1fr; }
}
.info-card {
background: var(--cell-bg); border: 1px solid var(--border);
border-radius: 10px; padding: 15px;
display: flex; flex-direction: column; gap: 8px;
}
.info-card h4 { margin: 0; color: var(--text-dim); font-size: 13px; font-weight: bold; }
textarea {
width: 100%; min-height: 90px;
background: var(--bg-dark); border: 1px solid var(--border);
border-radius: 6px; color: white;
font-family: inherit; padding: 10px;
resize: vertical; outline: none;
font-size: 13px; line-height: 1.5; box-sizing: border-box;
}
textarea:disabled {
background: rgba(15, 23, 42, 0.6);
color: #cbd5e1; cursor: not-allowed; border-style: dashed;
}
.sync-status {
font-size: 12px; color: #f59e0b; display: flex; align-items: center; gap: 5px;
}
.placeholder-text { text-align: center; color: var(--text-dim); padding: 40px 10px; }
.developer-signature { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 10px; font-weight: 600; letter-spacing: 0.5px; }
.developer-signature span { color: var(--primary); font-weight: bold; }

.welcome-modal {
position: fixed; top: 0; left: 0; right: 0; bottom: 0;
background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px);
z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
transition: opacity 0.4s ease, visibility 0.4s ease;
}
.modal-content {
background: var(--panel-bg); border: 2px solid var(--primary);
border-radius: 16px; padding: 40px 30px; text-align: center;
max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25);
}
.modal-content h1 { color: var(--primary); margin: 0 0 8px 0; font-size: 28px; font-weight: 700; }
</style>
</head>
<body>

<div id="welcomeModal" class="welcome-modal" style="opacity: 0; visibility: hidden;">
<div class="modal-content">
<h1>شركة نقل المياه</h1>
<p>لوحة الإنذارات الذكية</p>
</div>
</div>

<div class="app-container">
<div class="brand-header">
<div class="brand-title">
<h3>لوحة الإنذارات للوحدة</h3>
<input type="text" class="search-box" placeholder="ابحث عن إنذار فني..." onkeyup="filterAlarms(this.value)">
</div>
<div class="company-logo">
<img id="logoImg" src="https://instasize.com/api/image/468677e3bce3b1be1a34b8102f883c0773080e96f92413004b530bee9d1dd44b.png?download=true" alt="شعار الشركة" onerror="this.style.display='none'">
</div>
</div>

<div class="panel-section">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
<div class="section-title">🎛️ مصفوفة الإنذارات النشطة</div>
<div id="roleBadge" class="status-badge">جاري الاتصال بالسحابة...</div>
</div>
<div id="grid" class="annunciator-grid"></div>
</div>

<div id="detailsSection" class="details-section">
<div class="placeholder-text">💡 اضغط على أي إنذار في المصفوفة أعلاه لعرض أسبابه والإجراءات الفنية المطلوبة فوراً.</div>
</div>

<div class="developer-signature">By: <span id="designerName">MAJED M.FALQI</span></div>
</div>

<script>
const MY_NAME = "MAJED M.FALQI";
const LOGO_URL = "https://instasize.com/api/image/468677e3bce3b1be1a34b8102f883c0773080e96f92413004b530bee9d1dd44b.png?download=true";
// 🔗 رابط قاعدة البيانات السحابية الخاصة بك
const FIREBASE_URL = "https://alarms-1e2d2-default-rtdb.firebaseio.com/alarms.json";

const alarmNames = [
"Unit In Alarm","SIC On Fixed Speed","SIC Not Ready Auto","SIC Not Ready Fix SP","Control Mode Error","Lube Res Temp Low","Pump Seal Fail","Lube Pres Before TCV Low",
"SIC MV Warning","Brush Length","Unit Not On Auto","Uncon Non Urg Fail","MOV Sequence Fail","Lube Res Temp High","Lube Res Level Low","Filter Diff Pres High",
"Slipr Case Temp High","Cool Air Dif Press","Motor Air Temp High","Motor Bear Temp High","Motor Wind Temp High","Pump Bear Temp High","Pump Water Temp High","Pump Vibration High",
"Unit Tripped","Unit ESD","Seq Fail","Uncon Urg Fail","Suction Press Low","Discharge Press High","Lube Pres After Low",
"SIC MV Starter SD","DREAV On Command","MV Breaker Close","LO Temp High","LO Level Low Low",
"Slipr Case Temp HH","Motor Air Temp HH","Motor Bear Temp HH","Motor Wind Temp HH","Pump Bear Temp HH","Pump Water Temp HH","Pump Vibration HH"
];

// القاعدة الاحتياطية في حال انقطاع الإنترنت لأول مرة
const fallbackDB = {
"42": { "cause": "- وجود اهتزاز عالي جدًّا في المضخة", "action": "- فحص حساس الاهتزاز هل هو بالوضع الصحيح او لا\n- لا يتم تشغيل المضخة حتى إبلاغ قسم الأجهزة \n- إبلاغ قسم الميكانيكا في حالة وجود اهتزاز فعلي عالي", "dwg": "- قسم الأجهزة\n- قسم الميكانيكا" }
};

let db = Object.assign({}, fallbackDB);
let isAdmin = new URLSearchParams(window.location.search).get('edit') === 'majid99';
let saveTimeout = null;

// 🛠️ حقن ملف المانيفست ليدعم الـ PWA تلقائياً
(function injectManifest() {
const myManifest = {
"short_name": "LINEC Alarms",
"name": "لوحة إنذارات شركة نقل المياه",
"icons": [{ "src": LOGO_URL, "type": "image/png", "sizes": "512x512" }],
"start_url": ".",
"background_color": "#020617",
"theme-color": "#020617",
"display": "standalone",
"orientation": "portrait"
};
const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
const link = document.createElement('link');
link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
document.head.appendChild(link);
})();

window.addEventListener('DOMContentLoaded', function() {
setTimeout(function() {
var modal = document.getElementById('welcomeModal');
if(modal) { modal.style.opacity = '0'; setTimeout(function() { modal.style.visibility = 'hidden'; }, 400); }
}, 1000);
fetchCloudData();
});

// ☁️ جلب البيانات الفورية من السحابة
function fetchCloudData() {
fetch(FIREBASE_URL)
.then(res => res.json())
.then(data => {
if (data) { db = data; }
updateRoleBadge();
initGrid();
})
.catch(err => {
console.log("فشل الاتصال المباشر بالسحابة، تم تشغيل البيانات المحلية:", err);
updateRoleBadge();
initGrid();
});
}

function updateRoleBadge() {
var badge = document.getElementById('roleBadge');
if(isAdmin) {
badge.innerText = "وضع تعديل سحابي فوري (أدمن)";
badge.style.cssText = "color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,0.1);";
} else {
badge.innerText = "وضع استعراض سحابي (المشغلين)";
badge.style.cssText = "color: #10b981; border-color: #10b981; background: rgba(16, 185, 129, 0.1);";
}
}

function initGrid() {
document.getElementById('designerName').innerText = MY_NAME;
var grid = document.getElementById('grid');
grid.innerHTML = '';
alarmNames.forEach(function(name, index) {
var cell = document.createElement('div');
cell.className = 'cell' + (name === "" ? ' empty' : '');
if(db[index] && (db[index].cause || db[index].action || db[index].dwg || db[index].notes)) {
cell.classList.add('has-data');
}
cell.innerText = name;
cell.onclick = function() { showDetails(index, name); };
grid.appendChild(cell);
});
}

function showDetails(index, name) {
document.querySelectorAll('.cell').forEach(function(c) { c.classList.remove('active'); });
var cells = document.querySelectorAll('.cell');
if(cells[index]) cells[index].classList.add('active');

var data = db[index] || { cause:'', action:'', dwg:'', notes:'' };
var dis = isAdmin ? '' : 'disabled';

var syncHtml = isAdmin ? '<div class="sync-status" id="syncStatus">☁️ نظام الحفظ السحابي التلقائي نشط وجاهز...</div>' : '';

document.getElementById('detailsSection').innerHTML =
'<div><h2 class="alarm-header-title">' + name + '</h2>' + syncHtml + '</div>'
+ '<div class="info-cards-container">'
+ makeCard('⚠️ أسباب الإنذار (Root Cause)', index, 'cause', data.cause, dis)
+ makeCard('🛠️ الإجراءات التصحيحية (Actions)', index, 'action', data.action, dis)
+ makeCard('📑 القسم المسؤول (Depart Resp)', index, 'dwg', data.dwg, dis)
+ makeCard('📝 ملاحظات إضافية', index, 'notes', data.notes, dis)
+ '</div>';

if(window.innerWidth < 768) {
document.getElementById('detailsSection').scrollIntoView({ behavior:'smooth' });
}
}

function makeCard(title, index, field, value, dis) {
return '<div class="info-card">'
+ '<h4>' + title + '</h4>'
+ '<textarea ' + dis + ' placeholder="لا توجد بيانات مسجلة..." oninput="updateDB(' + index + ',\'' + field + '\',this.value)">' + (value||'') + '</textarea>'
+ '</div>';
}

// 🔄 تعديل وحفظ تلقائي في السحابة بمجرد الكتابة وبدون أزرار (Debounce 1 second)
function updateDB(index, field, value) {
if(!isAdmin) return;
if(!db[index]) db[index] = {};
db[index][field] = value;

var cells = document.querySelectorAll('.cell');
if(cells[index]) cells[index].classList.add('has-data');

const statusText = document.getElementById('syncStatus');
if(statusText) statusText.innerHTML = "⏳ جاري الكتابة...";

clearTimeout(saveTimeout);
saveTimeout = setTimeout(() => {
if(statusText) statusText.innerHTML = "🔄 جاري الحفظ في السحابة...";
fetch(FIREBASE_URL, {
method: 'PUT',
body: JSON.stringify(db),
headers: { 'Content-Type': 'application/json' }
})
.then(res => {
if(res.ok) { if(statusText) statusText.innerHTML = "✅ تم الحفظ سحابياً بنجاح الفوري!"; }
else { if(statusText) statusText.innerHTML = "❌ فشل الحفظ السحابي!"; }
})
.catch(err => {
if(statusText) statusText.innerHTML = "❌ خطأ في الاتصال بالشبكة!";
});
}, 1000);
}

function filterAlarms(val) {
document.querySelectorAll('.cell').forEach(function(cell) {
cell.style.opacity = cell.innerText.toLowerCase().includes(val.toLowerCase()) ? '1' : '0.15';
});
}
</script>
</body>
</html>
